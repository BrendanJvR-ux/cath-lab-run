const cv=document.getElementById('c'),g=cv.getContext('2d');g.scale(2,2);g.translate(-740,-8);
let seed=11;const R=()=>(seed=(seed*16807)%2147483647)/2147483647,rr=(a,b)=>a+(b-a)*R();
const INK='#1d1b19',PAPER='#f1ece1';

/* ---------- pen helpers ---------- */
function pen(pts,w=1,a=1){g.strokeStyle=`rgba(29,27,25,${a})`;g.lineWidth=w;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke()}
function wobble(x0,y0,x1,y1,j=0.6,n=6){const out=[];for(let i=0;i<=n;i++){const t=i/n;out.push([x0+(x1-x0)*t+rr(-j,j),y0+(y1-y0)*t+rr(-j,j)])}return out}
function hatch(clipFn,ang,gap,w,a,box=[0,0,1600,900]){g.save();g.beginPath();clipFn();g.clip();const c=Math.cos(ang),s=Math.sin(ang),[x0,y0,x1,y1]=box,cx=(x0+x1)/2,cy=(y0+y1)/2,L=Math.hypot(x1-x0,y1-y0);
  for(let k=-L/2;k<=L/2;k+=gap*rr(0.8,1.2)){const px=cx-s*k,py=cy+c*k;pen(wobble(px-c*L/2,py-s*L/2,px+c*L/2,py+s*L/2,0.5,10),w*rr(0.7,1.2),a*rr(0.7,1))}g.restore()}

const bz=(p,t)=>{const u=1-t;return [u*u*u*p[0][0]+3*u*u*t*p[1][0]+3*u*t*t*p[2][0]+t*t*t*p[3][0],u*u*u*p[0][1]+3*u*u*t*p[1][1]+3*u*t*t*p[2][1]+t*t*t*p[3][1]]};
/* a gnarled branch/root as a tube with bark lines and knots; recursive children */
function limb(p,w0,w1,depth,opts={}){
  const N=40,pts=[],L=[],Rt=[];for(let i=0;i<=N;i++)pts.push(bz(p,i/N));
  for(let i=0;i<=N;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(N,i+1)],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l,w=(w0+(w1-w0)*i/N)*(1+0.12*Math.sin(i*0.9+depth));
    L.push([pts[i][0]+nx*w,pts[i][1]+ny*w]);Rt.push([pts[i][0]-nx*w,pts[i][1]-ny*w])}
  const outline=()=>{g.moveTo(L[0][0],L[0][1]);L.forEach(q=>g.lineTo(q[0],q[1]));for(let i=Rt.length-1;i>=0;i--)g.lineTo(Rt[i][0],Rt[i][1]);g.closePath()};
  g.fillStyle=opts.fill||PAPER;g.beginPath();outline();g.fill();
  // bark: long wavy lines along the limb

  g.strokeStyle=INK;g.lineWidth=1.3;g.beginPath();g.moveTo(L[0][0],L[0][1]);L.forEach(q=>g.lineTo(q[0],q[1]));g.stroke();g.beginPath();g.moveTo(Rt[0][0],Rt[0][1]);Rt.forEach(q=>g.lineTo(q[0],q[1]));g.stroke();
  if(depth>0){const kids=opts.kids||2;for(let k=0;k<kids;k++){const t=rr(0.45,0.95),q=bz(p,t),q2=bz(p,Math.min(1,t+0.02)),dir=Math.atan2(q2[1]-q[1],q2[0]-q[0])+rr(-0.9,0.9)*(opts.spread||1),len=rr(0.35,0.6)*Math.hypot(p[3][0]-p[0][0],p[3][1]-p[0][1]);

  else{const q=pts[N];pen([[q[0],q[1]],[q[0]+rr(-6,6),q[1]+rr(-6,6)]],0.6)}
}

g.setLineDash([]);
for(let k=0;k<60;k++){const y0=HY-140+k*6;pen([[HX-180,y0+40],[HX-60,y0+rr(-6,6)],[HX+60,y0-30+rr(-6,6)],[HX+190,y0-70]].map(q=>[q[0]+rr(-1,1),q[1]+rr(-1,1)]),0.45,0.35)}

limb([[HX+15,HY-125],[HX-8,HY-30],[HX+28,HY+100],[HX+66,HY+184]],6.5,4,0,{fill:'#f4efe4'});
