<!-- Makes assets/skull-xray.png, the bone and soft tissue of the stroke room's X-ray, from the 3D model in
     tools/skull-model.js. Run `python3 tools/serve.py` from the repo root, open http://127.0.0.1:8767/tools/render_skull.html
     and press Save (or open it with ?save to save when done). Channels: red = bone, green = ink contours, blue = soft tissue. -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Skull X-ray renderer</title>
<style>body{font:14px system-ui;margin:12px;background:#eee}canvas{width:512px;height:512px;background:#fff;margin:4px;image-rendering:auto}</style></head>
<body>
<p id="st">Rendering…</p>
<div><canvas id="r" width="1024" height="1024"></canvas><canvas id="g" width="1024" height="1024"></canvas><canvas id="b" width="1024" height="1024"></canvas></div>
<p><button id="save" disabled>Save to assets/skull-xray.png</button></p>
<canvas id="png" width="1024" height="1024" style="display:none"></canvas>
<script src="skull-model.js"></script>
<script>
const st=document.getElementById('st');let png=null;
const t0=performance.now();
SKM.render(f=>st.textContent=`Rendering… ${Math.round(f*100)}%`).then(({N,R,G,B})=>{
  const show=(id,A)=>{const c=document.getElementById(id).getContext('2d'),im=c.createImageData(N,N);for(let i=0;i<N*N;i++){const v=255-Math.round(A[i]*255);im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=255}c.putImageData(im,0,0)};
  show('r',R);show('g',G);show('b',B);
  const c=document.getElementById('png').getContext('2d'),im=c.createImageData(N,N);
  for(let i=0;i<N*N;i++){im.data[i*4]=Math.round(R[i]*255);im.data[i*4+1]=Math.round(G[i]*255);im.data[i*4+2]=Math.round(B[i]*255);im.data[i*4+3]=255}
  c.putImageData(im,0,0);
  st.textContent=`Done in ${((performance.now()-t0)/1000).toFixed(1)} s`;window.SKULL_DONE=true;
  const btn=document.getElementById('save');btn.disabled=false;btn.onclick=save;if(location.search.includes('save'))save();
});
function save(){document.getElementById('png').toBlob(b=>fetch('/save-skull',{method:'POST',body:b}).then(r=>r.text()).then(t=>{st.textContent+=' · '+t;window.SKULL_SAVED=t}),'image/png')}
</script>
</body></html>
