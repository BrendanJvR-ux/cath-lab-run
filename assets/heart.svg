<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="Anterior view of the heart with the coronary arteries">
  <!-- Cath Lab Run: original illustration. Anterior view: the patient's left is on the viewer's right. -->
  <defs>
    <radialGradient id="vent" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#c8574a"/>
      <stop offset="0.45" stop-color="#9c3a32"/>
      <stop offset="1" stop-color="#5a1b19"/>
    </radialGradient>
    <radialGradient id="atr" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#b84c45"/>
      <stop offset="1" stop-color="#6a2220"/>
    </radialGradient>
    <linearGradient id="aorta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f2f2a"/>
      <stop offset="0.45" stop-color="#d0685c"/>
      <stop offset="1" stop-color="#8a2c28"/>
    </linearGradient>
    <linearGradient id="pulm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f4f86"/>
      <stop offset="0.5" stop-color="#7486c0"/>
      <stop offset="1" stop-color="#3d4c80"/>
    </linearGradient>
    <linearGradient id="svc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36447a"/>
      <stop offset="0.5" stop-color="#6576b0"/>
      <stop offset="1" stop-color="#36447a"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <!-- shadow -->
  <ellipse cx="215" cy="418" rx="120" ry="12" fill="#000" opacity="0.35"/>

  <!-- arch vessels -->
  <g stroke-linecap="round" fill="none">
    <path d="M196 64 C194 40 192 22 190 6" stroke="#8a2c28" stroke-width="16"/>
    <path d="M196 64 C194 40 192 22 190 6" stroke="#c35c51" stroke-width="7"/>
    <path d="M232 46 C233 30 234 16 235 2" stroke="#8a2c28" stroke-width="13"/>
    <path d="M232 46 C233 30 234 16 235 2" stroke="#c35c51" stroke-width="5"/>
    <path d="M262 52 C268 36 276 22 286 8" stroke="#8a2c28" stroke-width="13"/>
    <path d="M262 52 C268 36 276 22 286 8" stroke="#c35c51" stroke-width="5"/>
  </g>

  <!-- descending aorta (behind) -->
  <path d="M300 92 C306 130 306 170 302 215" stroke="#6e2420" stroke-width="40" fill="none" stroke-linecap="round"/>

  <!-- superior vena cava -->
  <path d="M100 30 L100 178 L134 178 L134 30 Q117 22 100 30 Z" fill="url(#svc)"/>
  <ellipse cx="117" cy="30" rx="17" ry="5" fill="#2c3766"/>

  <!-- ascending aorta and arch -->
  <path d="M178 205 C172 150 168 112 184 78 C204 36 274 36 296 78 C304 96 304 112 302 128" fill="none" stroke="url(#aorta)" stroke-width="46" stroke-linecap="round"/>
  <path d="M170 150 C168 118 176 90 192 70" fill="none" stroke="#e79a8c" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- left auricle (viewer's right, under the pulmonary trunk) -->
  <path d="M296 176 C320 160 352 178 338 206 C328 220 306 214 300 200 Z" fill="url(#atr)"/>

  <!-- right atrium -->
  <path d="M94 168 C66 188 70 252 116 272 C140 258 146 212 136 182 C126 164 104 160 94 168 Z" fill="url(#atr)"/>
  <!-- right auricle -->
  <path d="M128 176 C118 150 150 136 170 158 C164 176 144 184 128 176 Z" fill="#a8443d"/>

  <!-- ventricles -->
  <path d="M118 214 C108 266 150 344 256 410 C302 384 334 322 324 252 C318 212 292 190 262 186 L162 186 C140 190 124 198 118 214 Z" fill="url(#vent)"/>
  <!-- muscle sheen -->
  <path d="M150 230 C160 280 190 330 236 372" fill="none" stroke="#e28a7a" stroke-width="10" opacity="0.18" stroke-linecap="round"/>
  <path d="M286 232 C300 270 304 310 292 350" fill="none" stroke="#e28a7a" stroke-width="7" opacity="0.14" stroke-linecap="round"/>

  <!-- epicardial fat in the grooves -->
  <g fill="none" stroke-linecap="round" filter="url(#soft)">
    <path d="M184 204 C158 208 134 220 128 254 C122 288 140 322 176 346" stroke="#e7c27a" stroke-width="16" opacity="0.45"/>
    <path d="M238 202 C240 260 250 332 256 400" stroke="#e7c27a" stroke-width="14" opacity="0.4"/>
    <path d="M262 198 C286 204 306 212 324 232" stroke="#e7c27a" stroke-width="12" opacity="0.35"/>
  </g>

  <!-- pulmonary trunk (in front of the aorta) -->
  <path d="M206 222 C208 176 222 146 250 122" fill="none" stroke="url(#pulm)" stroke-width="42" stroke-linecap="round"/>
  <path d="M250 122 C278 108 310 110 340 122" fill="none" stroke="#4a5b94" stroke-width="22" stroke-linecap="round"/>
  <path d="M198 196 C200 170 210 150 226 136" fill="none" stroke="#a6b4e0" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <!-- cardiac veins -->
  <g fill="none" stroke="#5266a6" stroke-linecap="round">
    <path d="M230 392 C228 336 226 276 242 210" stroke-width="3"/>
    <path d="M262 214 C284 222 304 230 318 246" stroke-width="2.5"/>
  </g>

  <!-- coronary arteries -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#6b1512" stroke-width="8.5">
      <path d="M184 202 C158 206 134 218 128 252 C122 288 140 322 176 346"/>
      <path d="M238 204 C240 262 250 332 258 402"/>
      <path d="M262 200 C286 205 306 212 324 232"/>
    </g>
    <g stroke="#e0503f" stroke-width="5.5">
      <!-- right coronary artery in the right atrioventricular groove -->
      <path d="M184 202 C158 206 134 218 128 252 C122 288 140 322 176 346"/>
      <!-- left anterior descending in the anterior interventricular groove -->
      <path d="M238 204 C240 262 250 332 258 402"/>
      <!-- circumflex under the left auricle -->
      <path d="M262 200 C286 205 306 212 324 232"/>
    </g>
    <g stroke="#e0503f" stroke-width="3">
      <!-- conus and acute marginal branches of the RCA -->
      <path d="M160 208 C166 196 176 190 186 188"/>
      <path d="M134 290 C156 304 180 320 198 346"/>
      <path d="M130 258 C148 262 166 270 180 284"/>
      <!-- diagonal branches of the LAD -->
      <path d="M242 246 C262 262 284 284 300 316"/>
      <path d="M248 296 C266 314 280 338 288 366"/>
      <!-- obtuse marginal off the circumflex -->
      <path d="M312 220 C320 246 322 270 318 296"/>
    </g>
    <g stroke="#ff8a74" stroke-width="1.4" opacity="0.7">
      <path d="M184 201 C158 205 134 217 128 251"/>
      <path d="M238 210 C240 262 248 320 254 370"/>
    </g>
  </g>
</svg>
