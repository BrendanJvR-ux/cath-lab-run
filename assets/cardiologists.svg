<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" role="img" aria-label="Sketch of two cardiologists, a woman and a man, in scrubs, lead aprons and thyroid collars">
  <!-- Cath Lab Run: original hand-drawn illustration (ink and coloured pencil). -->
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2b2a33" stroke-width="1" opacity="0.22"/>
    </pattern>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#fff" opacity="0.55"/><circle cx="6.5" cy="6.5" r="1.1" fill="#2b2a33" opacity="0.18"/>
    </pattern>
  </defs>
  <g fill="none" stroke="#2b2a33" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

    <!-- a heartbeat between them, in red pencil -->
    <path d="M182 44 L204 44 L210 34 L217 58 L224 20 L231 50 L237 44 L262 44" stroke="#c2452d" stroke-width="2.6"/>

    <!-- ===== woman, left ===== -->
    <!-- long hair behind -->
    <path d="M100 96 C96 56 118 36 142 36 C168 36 188 56 184 98 C186 132 194 160 184 184 L102 184 C92 160 96 132 100 96 Z" fill="#6b4330"/>
    <!-- neck -->
    <path d="M128 150 L156 150 L158 184 L126 184 Z" fill="#f0c8a4"/>
    <!-- scrubs -->
    <path d="M58 320 C60 252 80 204 110 188 L174 188 C204 204 222 252 226 320 Z" fill="#8cc5bd"/>
    <!-- lead apron with a V neck, shaded at the sides -->
    <path d="M84 320 L92 224 C100 208 112 198 124 194 L142 216 L160 194 C172 198 186 208 194 224 L202 320 Z" fill="#3e5c86"/>
    <path d="M84 320 L92 224 C96 216 100 212 104 208 L100 320 Z" fill="url(#hatch)" stroke="none"/>
    <path d="M202 320 L194 224 C190 216 186 212 182 208 L186 320 Z" fill="url(#hatch)" stroke="none"/>
    <!-- thyroid collar -->
    <path d="M118 176 C130 188 154 188 166 176 L168 192 C154 202 130 202 116 192 Z" fill="#3e5c86"/>
    <!-- head -->
    <ellipse cx="142" cy="108" rx="33" ry="40" fill="#f0c8a4"/>
    <!-- scrub cap with a pattern -->
    <path d="M106 88 C104 52 124 40 142 40 C162 40 182 52 180 88 C164 76 122 76 106 88 Z" fill="#e8857a"/>
    <path d="M106 88 C104 52 124 40 142 40 C162 40 182 52 180 88 C164 76 122 76 106 88 Z" fill="url(#dots)" stroke="none"/>
    <path d="M110 88 C112 96 108 104 110 112" stroke-width="2"/>
    <!-- face -->
    <path d="M124 100 Q131 95 137 99" stroke-width="2"/><path d="M148 99 Q154 95 161 100" stroke-width="2"/>
    <ellipse cx="131" cy="110" rx="2.6" ry="3.2" fill="#2b2a33"/><ellipse cx="154" cy="110" rx="2.6" ry="3.2" fill="#2b2a33"/>
    <path d="M142 113 Q138 124 145 126" stroke-width="2"/>
    <path d="M131 135 Q142 144 154 135" stroke-width="2.2"/>
    <circle cx="124" cy="124" r="6" fill="#f2a093" stroke="none" opacity="0.45"/><circle cx="161" cy="124" r="6" fill="#f2a093" stroke="none" opacity="0.45"/>
    <circle cx="109" cy="122" r="2.6" fill="#e3b341"/><circle cx="175" cy="122" r="2.6" fill="#e3b341"/>
    <!-- stethoscope -->
    <path d="M120 194 C108 232 118 258 140 256 C152 255 156 246 154 238" stroke="#6e6a60" stroke-width="4"/>
    <path d="M164 194 C176 222 172 240 158 246" stroke="#6e6a60" stroke-width="4"/>
    <circle cx="154" cy="234" r="7" fill="#c9c4b6"/>
    <!-- name badge -->
    <rect x="164" y="252" width="26" height="17" rx="2" fill="#fbf6ea" stroke-width="1.8"/><path d="M169 258 H185 M169 263 H180" stroke-width="1.4"/>

    <!-- ===== man, right ===== -->
    <!-- neck -->
    <path d="M286 150 L314 150 L316 186 L284 186 Z" fill="#c98f62"/>
    <!-- scrubs -->
    <path d="M214 320 C218 254 238 206 268 190 L332 190 C362 206 382 254 386 320 Z" fill="#7fa6cf"/>
    <!-- arm and hand holding a guide catheter -->
    <path d="M352 214 C368 222 380 236 386 252 L370 262 C364 248 352 236 340 230 Z" fill="#7fa6cf"/>
    <ellipse cx="380" cy="258" rx="11" ry="9" fill="#c98f62"/>
    <path d="M380 250 C384 200 404 170 422 186 C434 198 420 214 408 204" stroke-width="3.2"/>
    <!-- lead apron, shaded at the sides -->
    <path d="M240 320 L250 228 C258 210 270 200 282 196 L300 218 L318 196 C330 200 342 210 350 228 L360 320 Z" fill="#9a4b4b"/>
    <path d="M240 320 L250 228 C254 220 258 216 262 212 L258 320 Z" fill="url(#hatch)" stroke="none"/>
    <path d="M360 320 L350 228 C346 220 342 216 338 212 L342 320 Z" fill="url(#hatch)" stroke="none"/>
    <!-- thyroid collar -->
    <path d="M276 180 C288 192 312 192 324 180 L326 196 C312 206 288 206 274 196 Z" fill="#9a4b4b"/>
    <!-- head and ears -->
    <ellipse cx="268" cy="112" rx="6" ry="10" fill="#c98f62"/><ellipse cx="332" cy="112" rx="6" ry="10" fill="#c98f62"/>
    <ellipse cx="300" cy="106" rx="32" ry="39" fill="#c98f62"/>
    <!-- short hair showing under the cap, and a trimmed beard -->
    <path d="M269 96 C268 86 270 80 274 76 M331 96 C332 86 330 80 326 76" stroke="#2e2622" stroke-width="5"/>
    <path d="M272 120 C276 148 290 154 300 154 C310 154 324 148 328 120 C320 136 310 141 300 141 C290 141 280 136 272 120 Z" fill="#3b2f2a" opacity="0.55"/>
    <!-- scrub cap -->
    <path d="M266 90 C262 54 282 40 300 40 C320 40 340 54 336 90 C320 78 282 78 266 90 Z" fill="#5b88b8"/>
    <path d="M266 90 C262 54 282 40 300 40 C320 40 340 54 336 90 C320 78 282 78 266 90 Z" fill="url(#dots)" stroke="none"/>
    <!-- glasses -->
    <rect x="273" y="97" width="22" height="17" rx="6" fill="#fbf6ea" fill-opacity="0.25"/><rect x="305" y="97" width="22" height="17" rx="6" fill="#fbf6ea" fill-opacity="0.25"/>
    <path d="M295 104 Q300 101 305 104" stroke-width="2"/>
    <ellipse cx="284" cy="106" rx="2.4" ry="3" fill="#2b2a33"/><ellipse cx="316" cy="106" rx="2.4" ry="3" fill="#2b2a33"/>
    <path d="M276 92 Q284 88 292 91" stroke-width="2"/><path d="M308 91 Q316 88 324 92" stroke-width="2"/>
    <path d="M300 110 Q297 121 303 123" stroke-width="2"/>
    <path d="M290 131 Q300 138 311 131" stroke-width="2.2"/>
    <!-- surgical mask pulled down under the chin -->
    <path d="M276 160 C288 170 312 170 324 160 L326 176 C312 184 288 184 274 176 Z" fill="#bfe0ef"/>
    <path d="M280 166 H320 M280 172 H320" stroke-width="1.2" opacity="0.6"/>
    <!-- name badge -->
    <rect x="320" y="254" width="26" height="17" rx="2" fill="#fbf6ea" stroke-width="1.8"/><path d="M325 260 H341 M325 265 H336" stroke-width="1.4"/>
  </g>
</svg>
