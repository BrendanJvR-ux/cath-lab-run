<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cath Lab Run tests</title>
<style>
:root{--bg:#0e1214;--fg:#dce3e6;--muted:#869399;--ok:#5fe08c;--bad:#ff6a63;--line:#29343a;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "IBM Plex Mono",ui-monospace,Menlo,monospace;padding:20px max(16px,env(safe-area-inset-left,0px))}
h1{font:600 22px/1.2 system-ui,sans-serif;margin:0 0 4px}
#sum{margin:0 0 16px;color:var(--muted)}
#sum.ok{color:var(--ok)}#sum.bad{color:var(--bad)}
ol{padding-left:1.4em;margin:0;display:flex;flex-direction:column;gap:4px}
li.ok::marker{color:var(--ok)}li.bad{color:var(--bad)}
li small{color:var(--muted)}
canvas{display:none}
</style>
</head>
<body>
<h1>Cath Lab Run tests</h1>
<p id="sum">Running…</p>
<ol id="out"></ol>
<canvas id="img" width="512" height="512"></canvas>
<script src="../config/config.js"></script>
<script src="../cases/lad-exertional-angina.js"></script>
<script src="../cases/rca-inferior-nstemi.js"></script>
<script src="../cases/lcx-breathless-diabetic.js"></script>
<script src="../js/sim.js"></script>
<script src="../js/gen.js"></script>
<script>
"use strict";
const results=[];
function test(name,fn){try{const note=fn();results.push({name,ok:true,note})}catch(e){results.push({name,ok:false,note:e.message})}}
function ok(cond,msg){if(!cond)throw new Error(msg||'assertion failed')}
const inRoot=(type,th,u)=>cathState({type,th,s:S_ROOT+22*u});

test('Three cases load, and every lesion sits on a real vessel',()=>{
  ok(CASES.length===3,'expected 3 cases, got '+CASES.length);
  for(const c of CASES)for(const L of c.lesions){const v=VBY[L.vid];ok(v,'unknown vessel '+L.vid);ok(L.at>0&&L.at<v.len,`${L.vid} at ${L.at} mm is outside its ${v.len.toFixed(0)} mm length`);ok(L.sev>0&&L.sev<1,'severity must be 0–1')}
  return CASES.map(c=>c.title).join(' · ');
});
test('Every branch joins its parent vessel',()=>{for(const v of VESSELS)if(v.parent){ok(v.base>0,v.id+' has no join point')}});
test('Vessels are tortuous, but branches still meet their parents and the ostia stay put',()=>{
  let worst=0;for(const v of VESSELS)if(v.parent){const P=VBY[v.parent];worst=Math.max(worst,Math.min(...P.p.map(q=>dist3(q,v.p[0]))))}
  ok(worst<0.8,'a branch starts '+worst.toFixed(1)+' mm from its parent');
  ok(dist3(VBY.LM.p[0],VESSELS[0].ctrl[0])<1e-9&&dist3(VBY.RCA.p[0],VBY.RCA.ctrl[0])<1e-9,'an ostium moved');
  const v=VBY.LAD,chord=dist3(v.p[0],v.p[v.n-1]);return `LAD ${v.len.toFixed(0)} mm long over a ${chord.toFixed(0)} mm span`;
});
test('Catheter in the descending aorta is not engaged and can be exchanged',()=>{const c=cathState({type:'JL',th:0,s:60});ok(!c.eng&&c.u===0);ok(c.region==='Descending aorta',c.region);ok(60<S_EXCH)});
test('JL4 pointed at the left main engages the left system',()=>{const c=inRoot('JL',OSTANG.L,1);ok(c.eng==='L','got '+c.eng);ok(!c.deep)});
test('JL4 engages anywhere inside its window, not outside it',()=>{
  ok(inRoot('JL',OSTANG.L+CATH.JL.tol-1,1).eng==='L','edge of window should engage');
  ok(!inRoot('JL',OSTANG.L+CATH.JL.tol+5,1).eng,'outside window should not engage');
});
test('JL4 never engages the RCA',()=>{ok(!inRoot('JL',OSTANG.R,1).eng)});
test('JR4 pointed at the RCA engages the right system',()=>{ok(inRoot('JR',OSTANG.R,1).eng==='R')});
test('Pushing past the ostium deep-seats the catheter',()=>{const c=inRoot('JR',OSTANG.R,1.58);ok(c.eng==='R'&&c.deep)});
test('Advancing from the aorta into the root moves the tip smoothly, without jumps',()=>{
  let worst=0;for(const type of ['JL','JR'])for(const th of [CATH.JL.home,CATH.JR.home,0,170,OSTANG.L,OSTANG.R]){let prev=null;for(let s=S_ROOT-40;s<S_ROOT+22*1.6;s+=0.5){const t=cathState({type,th,s},DIFFICULTY.easy).tip;if(prev)worst=Math.max(worst,dist3(t,prev));prev=t}}
  ok(worst<3,'tip jumped '+worst.toFixed(1)+' mm');return `largest step ${worst.toFixed(1)} mm per 0.5 mm advanced`;
});
test('An engaged catheter tip sits exactly in the ostium, in every view and every engagement angle',()=>{
  let worst=0;for(const type of ['JL','JR'])for(const D of Object.values(DIFFICULTY)){const sys=CATH[type].sys;
    for(let off=-D.tol[sys]+0.5;off<D.tol[sys];off+=2)for(let u=0.55;u<1.0;u+=0.05){const c=cathState({type,th:OSTANG[sys]+off,s:S_ROOT+22*u},D);if(c.eng)worst=Math.max(worst,dist3(c.tip,OST[sys]))}}
  ok(worst<0.01,'tip is '+worst.toFixed(1)+' mm from the ostium while engaged');
});
test('Catheter tip moves when torqued in the root',()=>{const a=inRoot('JL',-120,0.3).tip,b=inRoot('JL',60,0.3).tip;ok(Math.hypot(a[0]-b[0],a[2]-b[2])>10,'tip barely moved')});
test('Lesion labels read like a report',()=>{
  const labels=CASES.map(c=>prepLesions(c.lesions).map(L=>L.label).join(', '));
  ok(labels[0]==='proximal LAD',labels[0]);ok(labels[1]==='mid RCA',labels[1]);return labels.join(' · ');
});
test('An eccentric lesion looks different in different projections, never worse than it is',()=>{
  const L=prepLesions(CASES[0].lesions)[0];
  const vals=PRESETS.map(p=>apparent(L,basis(p[1],p[2])));
  const lo=Math.min(...vals),hi=Math.max(...vals);
  ok(hi<=L.sev+1e-9,'apparent exceeds true severity');ok(hi-lo>0.15,'too little difference between views');
  return `looks ${Math.round(lo*100)}–${Math.round(hi*100)}% (true ${Math.round(L.sev*100)}%)`;
});
test('A well-sized stent covering the lesion leaves a small residual',()=>{
  const L=prepLesions(CASES[0].lesions)[0],ref=refDiam(L.vid,L.at),d=STENT_DIAMS.reduce((a,b)=>Math.abs(b-ref)<Math.abs(a-ref)?b:a);
  const o=stentOutcome(L,{vid:L.vid,ld:L.at,len:18,diam:d,atm:14});
  ok(o&&o.covered&&!o.under&&!o.over&&!o.lowP,'should be a clean result');ok(o.residual<=0.1,'residual '+o.residual);
  return `${d.toFixed(1)} mm stent in a ~${ref.toFixed(1)} mm vessel → residual ${Math.round(o.residual*100)}%`;
});
test('Undersizing, low pressure and a short off-centre stent each leave more narrowing',()=>{
  const L=prepLesions(CASES[0].lesions)[0],ref=refDiam(L.vid,L.at);
  const good=stentOutcome(L,{vid:L.vid,ld:L.at,len:18,diam:3.5,atm:14}).residual;
  const under=stentOutcome(L,{vid:L.vid,ld:L.at,len:18,diam:ref-1,atm:14});ok(under.under&&under.residual>good,'undersize');
  const low=stentOutcome(L,{vid:L.vid,ld:L.at,len:18,diam:3.5,atm:9});ok(low.lowP&&low.residual>good,'low pressure');
  const miss=stentOutcome(L,{vid:L.vid,ld:L.at+8,len:12,diam:3.5,atm:14});ok(miss&&!miss.covered&&miss.residual>good,'geographic miss');
});
test('A stent away from the lesion, or in another vessel, does not touch it',()=>{
  const L=prepLesions(CASES[0].lesions)[0];
  ok(stentOutcome(L,{vid:L.vid,ld:L.at+40,len:12,diam:3,atm:14})===null);ok(stentOutcome(L,{vid:'RCA',ld:L.at,len:18,diam:3,atm:14})===null);
});
test('Harder difficulties need more accurate torque',()=>{
  const off=20;const at=d=>!!cathState({type:'JL',th:OSTANG.L+off,s:S_ROOT+22},DIFFICULTY[d]).eng;
  ok(at('easy')&&at('medium')&&!at('hard'),`20° off: easy ${at('easy')}, medium ${at('medium')}, hard ${at('hard')}`);
  ok(DIFFICULTY.hard.deep<DIFFICULTY.easy.deep,'hard should damp sooner');
});
test('Balloon angioplasty alone leaves recoil; a stent afterwards does better',()=>{
  const L=prepLesions(CASES[1].lesions)[0],ref=refDiam(L.vid,L.at);
  const b=balloonOutcome(L,{vid:L.vid,ld:L.at,len:15,diam:Math.round(ref*2)/2-0.5,atm:10});
  ok(b&&b.residual>=0.3&&b.residual<L.sev,'balloon residual '+b.residual);
  return `${Math.round(L.sev*100)}% → ${Math.round(b.residual*100)}% after the balloon`;
});
test('A subtotal lesion stented without predilation is underexpanded',()=>{
  const L=prepLesions(CASES[1].lesions)[0];ok(L.sev>=0.9);
  const s={vid:L.vid,ld:L.at,len:18,diam:3.5,atm:14};
  const raw=stentOutcome({...L},s),pre=stentOutcome({...L,predil:true,cur:0.4},s);
  ok(raw.noPre&&!pre.noPre&&raw.residual>pre.residual,`without ${raw.residual}, with ${pre.residual}`);
});
test('Oversized balloon flags a dissection; post-dilating a stent improves it',()=>{
  const L=prepLesions(CASES[0].lesions)[0],ref=refDiam(L.vid,L.at);
  ok(balloonOutcome(L,{vid:L.vid,ld:L.at,len:15,diam:ref+1,atm:12}).over,'should be oversized');
  const st={...L,stented:true,cur:0.12};const o=balloonOutcome(st,{vid:L.vid,ld:L.at,len:15,diam:3.5,atm:16});ok(o.post&&o.residual<0.12,'post-dilation');
});
test('The right ostium has a wider window than the left on every difficulty',()=>{for(const [k,d] of Object.entries(DIFFICULTY))ok(d.tol.R>d.tol.L,k);
  const at=(d,off)=>cathState({type:'JR',th:OSTANG.R-off,s:S_ROOT+22},DIFFICULTY[d]).eng==='R';ok(at('easy',50)&&at('medium',28)&&at('hard',15),'windows');return 'Easy 55°, Medium 32°, Hard 18°'});
test('Easy has no contrast limit; Medium and Hard do',()=>{ok(DIFFICULTY.easy.budgetX===null);ok(DIFFICULTY.medium.budgetX===1&&DIFFICULTY.hard.budgetX<1)});
test('Every shop avatar exists and every shop item has a price',()=>{for(const it of SHOP){ok(it.price>0,it.id);if(it.kind==='avatar')ok(AVATARS[it.avatar]&&AVATARS[it.avatar].shop===it.id,it.id)}return SHOP.length+' items'});
test('Every vessel has an ECG territory lead',()=>{for(const v of VESSELS)ok(LEADS.includes(TERRITORY[v.id]),v.id+' has no lead');return 'LAD→V3, circumflex→V5, RCA→II'});
test('Coverage segments span every vessel',()=>{const ids=new Set(MAP_SEGS.map(s=>s.v.id));for(const v of VESSELS)ok(ids.has(v.id),v.id);ok(mapKey(VBY.LAD,VBY.LAD.len)==='LAD:2');return MAP_SEGS.length+' segments'});
test('Contrast darkens the image where the coronaries are',()=>{
  ictx=document.getElementById('img').getContext('2d');
  const base={t:5,phase:0.3,a:-30,b:-25,mode:'cine',frame:0,lesions:[],cath:false,root:0};
  const lum=()=>{const d=ictx.getImageData(0,0,512,512).data;let s=0;for(let i=0;i<d.length;i+=16)s+=d[i];return s};
  renderImage({...base,conc:()=>0});const empty=lum();
  renderImage({...base,conc:()=>1});const full=lum();
  ok(full<empty*0.99,'no visible contrast');return `${((1-full/empty)*100).toFixed(1)}% darker`;
});
test('A closed dissection stops contrast beyond it, not before it or in branches that leave above it',()=>{
  const v=VBY.LAD,at=45,ev={kind:'dissection',vid:'LAD',ld:at,len:10,progress:1,closed:true,treated:false};
  const idx=mm=>v.ld.findIndex(x=>x>=mm);
  ok(flowMod(v,idx(70),[ev]).att===0,'distal LAD still fills');ok(flowMod(v,idx(20),[ev]).att===1,'proximal LAD affected');
  let up=0,down=0;for(const b of VESSELS){if(!b.anc.has('LAD'))continue;let cur=b;while(cur.parent!=='LAD')cur=VBY[cur.parent];const j=v.ld[cur.joinIdx],a=flowMod(b,b.n-1,[ev]).att;
    if(j<at){ok(a===1,b.id+' leaves above the dissection but lost flow');up++}else{ok(a===0,b.id+' leaves below the dissection but still fills');down++}}
  ok(flowMod(VBY.RCA,10,[ev]).att===1,'the other system is untouched');
  return `${up} branch${up===1?'':'es'} above, ${down} below`;
});
test('No-reflow slows and fades contrast beyond the stent; treatment restores it',()=>{
  const v=VBY.LAD,i=v.ld.findIndex(x=>x>=70),ev={kind:'noreflow',vid:'LAD',ld:30,flow:0.15};
  const m=flowMod(v,i,[ev]);ok(m.delay>1&&m.att<0.5,`delay ${m.delay.toFixed(1)} s, att ${m.att.toFixed(2)}`);
  ev.flow=1;const n=flowMod(v,i,[ev]);ok(n.delay===0&&n.att===1);return `TIMI 1: +${m.delay.toFixed(1)} s transit, ${Math.round(m.att*100)}% density`;
});
test('A stent covers a dissection only if it spans it',()=>{
  const ev={vid:'LAD',ld:40};ok(stentCovers({vid:'LAD',ld:44,len:18},ev));ok(!stentCovers({vid:'LAD',ld:60,len:18},ev));ok(!stentCovers({vid:'LCx',ld:40,len:18},ev));
});
test('Complication risks follow the clinical picture',()=>{
  ok(noReflowRisk({acs:true,sev:0.95,len:28})>2*noReflowRisk({acs:false,sev:0.75,len:12}),'no-reflow should be likelier in ACS with a subtotal lesion');
  ok(dissectRisk({kind:'balloon',over:true})===1,'oversized balloon always dissects');ok(dissectRisk({kind:'balloon',stented:true,sev:0.9,atm:12})===0,'post-dilating inside a stent cannot dissect');
  ok(DIFFICULTY.hard.dissectT<DIFFICULTY.easy.dissectT&&DIFFICULTY.hard.compX>DIFFICULTY.easy.compX,'harder = faster closure, more complications');
  ok(IC_DRUGS.find(d=>d.id==='vera').gain>IC_DRUGS.find(d=>d.id==='gtn').gain*4,'verapamil should beat GTN for no-reflow');
});

test('A perforation bleeds into the pericardium until sealed; distal flow is kept',()=>{
  const maj={kind:'perforation',grade:'major'},dis={kind:'perforation',grade:'distal'};
  ok(evFlow(maj)===1,'a perforation should not stop distal flow');
  ok(perfLeak(maj)>2*perfLeak(dis),'a big hole should bleed faster than a wire exit');
  ok(perfLeak(maj,{protamine:true})<perfLeak(maj)&&perfLeak(maj,{balloon:true})===0&&perfLeak({...maj,sealed:true})===0,'protamine slows, a balloon stops, sealing ends the leak');
  const t=0.8/perfLeak(maj);ok(t>25&&t<60,`tamponade after ${t.toFixed(0)} s`);
  return `untreated big hole tamponades in ~${t.toFixed(0)} s, a wire exit in ~${(0.8/perfLeak(dis)).toFixed(0)} s`;
});
test('Perforation risk follows oversizing, pressure and wire type',()=>{
  ok(perfRisk({diff:1.2,atm:12})>=0.5&&perfRisk({diff:0.3,atm:12})===0,'oversize');ok(perfRisk({diff:0.3,atm:17})>0,'over burst pressure');
  ok(perfRisk({kind:'wire',hydrophilic:true})>perfRisk({kind:'wire'}),'hydrophilic wires perforate more');
});
test('Spasm: tight spasm limits flow, mild spasm does not; GTN relieves it, adenosine does not',()=>{
  ok(evFlow({kind:'spasm',sev:0.6})===1,'mild spasm');ok(evFlow({kind:'spasm',sev:0.92})<0.5,'tight spasm');
  const v=VBY.RCA,i=v.n-1;ok(flowMod(v,i,[{kind:'spasm',vid:'RCA',ld:4,sev:0.92}]).att<0.7,'distal RCA should fade behind a tight ostial spasm');
  const d=id=>IC_DRUGS.find(x=>x.id===id);ok(d('gtn').spasm===1&&d('adeno').spasm===0&&d('vera').spasm>0.5);
  ok(spasmRisk({cause:'eng',sys:'R'})>spasmRisk({cause:'eng',sys:'L'})&&spasmRisk({cause:'deep'})>spasmRisk({cause:'eng',sys:'R'}),'RCA and deep-seating are touchier');
});

test('Flow estimates: calibrated to the stenosis, multiplied in series, and only downstream',()=>{
  const near=(a,b,t)=>Math.abs(a-b)<=t;
  ok(near(stenFlow(0.5),0.9,0.04)&&near(stenFlow(0.7),0.72,0.05)&&near(stenFlow(0.8),0.52,0.06)&&near(stenFlow(0.9),0.23,0.05),'calibration');
  const L={vid:'LAD',at:40,sev:0.8,cur:null};
  const pre=vesselFlow('LAD',[L],null,false),post=vesselFlow('LAD',[{...L,cur:0.08}],[],true);ok(pre.f<0.6&&post.f>0.95,`${pre.f.toFixed(2)} → ${post.f.toFixed(2)}`);
  ok(vesselFlow('LAD',[L,{vid:'LAD',at:90,sev:0.7}],null,false).f<pre.f,'two lesions in series should be worse than one');
  // a branch leaving above the lesion is unaffected, one leaving below it is
  const lad=VBY.LAD;for(const b of VESSELS)if(b.parent==='LAD'){const j=lad.ld[b.joinIdx],f=vesselFlow(b.id,[L],null,false).f;ok(j<L.at?f===1:f<0.6,b.id)}
  const closed=vesselFlow('LAD',[{...L,cur:0.05}],[{kind:'dissection',vid:'LAD',ld:60,closed:true,treated:false,progress:1}],true);ok(closed.timi===0&&closed.f<0.03,'closed vessel');
  return `80% LAD: ${Math.round(pre.f*100)}% of normal (TIMI ${pre.timi}) → stented ${Math.round(post.f*100)}% (TIMI ${post.timi})`;
});
test('The shop no longer sells monitor filters, and old purchases are refundable',()=>{ok(!SHOP.some(x=>x.kind==='lut'),'filters still on sale');ok(RETIRED_SHOP.warm>0&&RETIRED_SHOP.cool>0)});

/* random patients (run last; they rebuild the anatomy, and the final test restores the default) */
test('Case codes round-trip, and a code always gives the same patient',()=>{
  for(const n of [0,1,12345,CODE_SPACE-1])ok(codeToSeed(seedToCode(n))===n,'round trip '+n);
  ok(codeToSeed('clr-7kq2m')===codeToSeed('CLR-7KQ2M'),'case-insensitive');ok(codeToSeed('CLR-0000O')===null&&codeToSeed('hello')===null,'rejects junk');
  const a=JSON.stringify(generatePatient('CLR-7KQ2M')),b=JSON.stringify(generatePatient('CLR-7KQ2M'));ok(a===b,'not deterministic');
  ok(JSON.stringify(generatePatient('CLR-7KQ2N'))!==a,'neighbouring codes should differ');
});
test('400 random patients: valid anatomy, stentable culprit, engageable ostia',()=>{
  const dom={R:0,L:0,C:0};let ramus=0,lesions=0;
  for(let i=0;i<400;i++){
    const code=seedToCode((i*7919+13)%CODE_SPACE),c=generatePatient(code);buildAnatomy(c.anatomy);dom[c.anatomy.dom]++;if(c.anatomy.ramus)ramus++;
    for(const v of VESSELS){ok(LEADS.includes(TERRITORY[v.id]),code+': '+v.id+' has no ECG lead');
      if(v.parent){const P=VBY[v.parent];ok(Math.min(...P.p.map(q=>dist3(q,v.p[0])))<0.8,code+': '+v.id+' detached')}}
    if(c.anatomy.dom==='L')ok(!VBY.PDA&&VBY.LPDA,code+': left dominance should move the PDA to the circumflex');
    ok(c.lesions.length>=1&&c.lesions.some(L=>L.sev>=0.7),code+': no significant lesion');
    for(const L of prepLesions(c.lesions)){lesions++;const v=VBY[L.vid];ok(v&&L.at>0&&L.at<v.len,code+': lesion off its vessel');if(L.sev>=0.7)ok(refDiam(L.vid,L.at)>=2.3,code+': significant lesion in a vessel too small to stent')}
    ok(c.hx&&c.title&&c.task&&c.budget>0,code+': missing text');
    for(const d of ['easy','hard'])ok(cathState({type:'JR',th:OSTANG.R,s:S_ROOT+22},DIFFICULTY[d]).eng==='R'&&cathState({type:'JL',th:OSTANG.L,s:S_ROOT+22},DIFFICULTY[d]).eng==='L',code+': ostium not engageable on '+d);
  }
  ok(dom.L>10&&dom.C>10&&dom.R>200,'dominance mix '+JSON.stringify(dom));ok(ramus>30,'ramus '+ramus);
  return `right ${dom.R} · left ${dom.L} · co-dominant ${dom.C} · ramus ${ramus} · ${lesions} lesions`;
});
test('A posteriorly placed RCA origin needs more clockwise torque than usual',()=>{
  buildAnatomy();const base=OSTANG.R;buildAnatomy({rca:'posterior'});const post=OSTANG.R;buildAnatomy();
  ok(post-base>8,`${base.toFixed(0)}° → ${post.toFixed(0)}°`);return `${base.toFixed(0)}° → ${post.toFixed(0)}°`;
});
test('The default anatomy is restored for the teaching cases',()=>{buildAnatomy();ok(VBY.PLV&&VBY.PDA&&!VBY.RI&&!VBY.LPDA);ok(prepLesions(CASES[1].lesions)[0].label==='mid RCA')});

const bad=results.filter(r=>!r.ok).length,sum=document.getElementById('sum');
sum.textContent=bad?`${bad} of ${results.length} failed`:`All ${results.length} passed`;sum.className=bad?'bad':'ok';
document.getElementById('out').innerHTML=results.map(r=>`<li class="${r.ok?'ok':'bad'}">${r.ok?'Pass':'FAIL'}: ${r.name}${r.note?` <small>· ${r.note}</small>`:''}</li>`).join('');
</script>
</body>
</html>
